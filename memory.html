<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Memory Match - Ray Edition</title>

    <!-- PWA Setup -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#333333">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">

    <!-- Use a robust pixel font -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Authentic UI Colors */
            --bg-checker: #7E7E7E;
            --bg-checker-dark: #707070;
            --panel-bg: #DCDCDC;
            --panel-outer-border: #000000;
            --panel-inner-light: #FFFFFF;
            --panel-inner-dark: #555555;

            --btn-gray: #BDBDBD;
            --btn-gray-dark: #8B8B8B;
            --btn-yellow: #FFD700;
            --btn-yellow-dark: #B8860B;
            --btn-blue: #4682B4;
            --btn-blue-dark: #2F4F4F;
            --btn-green: #32CD32;
            --btn-green-dark: #006400;
            --btn-red: #FF6347;
            --btn-red-dark: #8B0000;

            --text-dark: #222;
            --text-gold: #FFD700;

            --hud-bg-black: rgba(34, 34, 34, 0.9);
            --hud-bg-white: rgba(255, 255, 255, 0.95);

            --game-sky: #74B9FF;
            --game-grass: #55EFC4;
            --game-dirt: #8D6E63;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            margin: 0;
            padding: 0;
            font-family: 'VT323', monospace;
        }

        body,
        html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-checker);
            background-image:
                linear-gradient(45deg, var(--bg-checker-dark) 25%, transparent 25%, transparent 75%, var(--bg-checker-dark) 75%, var(--bg-checker-dark)),
                linear-gradient(45deg, var(--bg-checker-dark) 25%, transparent 25%, transparent 75%, var(--bg-checker-dark) 75%, var(--bg-checker-dark));
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            touch-action: manipulation;
        }

        /* 3D Pixel Border Mixin */
        .pixel-border {
            border: 4px solid var(--panel-outer-border);
            position: relative;
        }

        .pixel-border::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-top: 4px solid var(--panel-inner-light);
            border-left: 4px solid var(--panel-inner-light);
            border-bottom: 4px solid var(--panel-inner-dark);
            border-right: 4px solid var(--panel-inner-dark);
            pointer-events: none;
        }

        /* SCREENS */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
        }

        /* MAIN MENU */
        #main-menu {
            padding: 20px;
            gap: 15px;
        }

        .menu-panel {
            background: var(--panel-bg);
            width: 100%;
            max-width: 600px;
            padding: 25px 15px 15px;
            position: relative;
        }

        .panel-header {
            position: absolute;
            top: -12px;
            left: 16px;
            background: var(--panel-outer-border);
            color: var(--text-gold);
            padding: 2px 8px;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 2;
        }

        .btn {
            background: var(--btn-gray);
            color: #000;
            padding: 8px 16px;
            font-size: 1.2rem;
            cursor: pointer;
            position: relative;
            text-shadow: 1px 1px 0 #FFF;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-yellow {
            background: var(--btn-yellow);
        }

        .btn-blue {
            background: var(--btn-blue);
            color: #FFF;
            text-shadow: 1px 1px 0 #000;
        }

        .btn-green {
            background: var(--btn-green);
            color: #FFF;
            text-shadow: 2px 2px 0 #000;
            font-size: 3rem;
            padding: 15px 40px;
        }

        .section-title {
            text-align: center;
            font-size: 1.4rem;
            color: #000;
            margin: 15px 0 10px;
            font-weight: bold;
        }

        .segment-group {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .segment-btn {
            background: var(--btn-gray);
            padding: 8px 16px;
            cursor: pointer;
            font-size: 1.4rem;
            color: #444;
            border: 4px solid transparent;
        }

        .segment-btn.selected {
            background: var(--panel-inner-light);
            border-top: 4px solid var(--panel-inner-dark);
            border-left: 4px solid var(--panel-inner-dark);
            border-bottom: 4px solid var(--panel-inner-light);
            border-right: 4px solid var(--panel-inner-light);
            color: #000;
            font-weight: bold;
            box-shadow: inset 4px 4px 0 rgba(0, 0, 0, 0.1);
        }

        .action-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }

        /* GAME SCREEN */
        #game-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: linear-gradient(to bottom, var(--game-sky) 0%, var(--game-sky) 38%, var(--game-grass) 38%, var(--game-grass) 42%, var(--game-dirt) 42%, var(--game-dirt) 100%);
        }

        /* HUD Overlays */
        #hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            pointer-events: none;
            padding: env(safe-area-inset-top, 10px) 10px 0 10px;
        }

        .hud-top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .hud-left-panel {
            background: var(--hud-bg-black);
            border: 4px solid var(--panel-inner-light);
            border-right-color: #999;
            border-bottom-color: #999;
            padding: 10px 15px;
            color: #FFF;
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #hud-matches {
            font-size: 1.2rem;
            letter-spacing: 2px;
        }

        #hud-attempts {
            font-size: 1.2rem;
            color: var(--btn-yellow);
            letter-spacing: 2px;
        }

        .hud-center-panel {
            background: var(--hud-bg-white);
            border: 6px solid var(--btn-blue);
            padding: 10px 20px;
            text-align: center;
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.5);
            min-width: 100px;
        }

        .hud-title {
            font-size: 1.5rem;
            color: #000;
            font-weight: bold;
        }

        .hud-right-group {
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }

        .hud-btn {
            font-size: 1.2rem;
            padding: 10px 15px;
            cursor: pointer;
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.5);
            border: 4px solid #FFF;
        }

        .hud-btn-exit {
            background: var(--btn-yellow);
            color: #000;
            border-color: #FFF #999 #999 #FFF;
        }

        /* MEMORY GRID */
        #game-board {
            position: absolute;
            top: 100px;
            /* Below HUD */
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 600px;
            height: calc(100% - 120px);
            display: grid;
            gap: 10px;
            justify-content: center;
            align-content: start;
            z-index: 5;
            padding-bottom: 20px;
        }

        .card {
            perspective: 1000px;
            cursor: pointer;
            width: 100%;
            height: 100%;
            min-height: 80px;
            /* Minimum height for small screens */
            position: relative;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner,
        .card.matched .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #000;
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.5);
            border-top-color: var(--panel-inner-light);
            border-left-color: var(--panel-inner-light);
            border-bottom-color: var(--panel-inner-dark);
            border-right-color: var(--panel-inner-dark);
        }

        .card-front {
            background: #D97736;
            /* Wood/Box color */
            background-image:
                linear-gradient(45deg, #C56627 25%, transparent 25%, transparent 75%, #C56627 75%, #C56627),
                linear-gradient(45deg, #C56627 25%, transparent 25%, transparent 75%, #C56627 75%, #C56627);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: #FFF;
            font-size: 2.5rem;
            text-shadow: 2px 2px 0 #000;
        }

        .card-back {
            background: #FFF;
            color: #000;
            transform: rotateY(180deg);
            flex-direction: column;
        }

        .card.matched .card-back {
            background: #E8F5E9;
            border-color: var(--btn-green);
        }

        .card-emoji {
            font-size: clamp(2rem, 8vw, 3.5rem);
            line-height: 1;
        }

        .card-word {
            font-weight: bold;
            text-transform: uppercase;
            font-size: clamp(1.2rem, 5vw, 2rem);
            padding: 5px;
            text-align: center;
            word-break: break-all;
        }

        /* Dialog Menus */
        .dialog-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .dialog-overlay.active {
            display: flex;
        }

        .dialog-box {
            background: var(--panel-bg);
            padding: 30px;
            text-align: center;
            width: 80%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .dialog-title {
            font-size: 3rem;
            color: #000;
            text-shadow: 2px 2px 0 #FFF;
        }

        @media (max-width: 500px) {
            .hud-center-panel {
                display: none;
                /* Hide on small screens to save space */
            }
        }
    </style>
</head>

<body>

    <!-- MAIN MENU -->
    <div id="main-menu" class="screen active">

        <div class="menu-panel pixel-border"
            style="text-align: center; margin-bottom: 20px; background: rgba(0,0,0,0.8); border-color: #FFF;">
            <div class="dialog-title" style="color: #FFF; text-shadow: 2px 2px 0 var(--btn-blue);">MEMORY MATCH</div>
            <div style="color: #FFF; font-size: 1.2rem; margin-top: 10px;">Find pairs of Words and Emojis!</div>
        </div>

        <div class="menu-panel pixel-border">
            <div class="panel-header">GAME SETTINGS</div>

            <div class="section-title">[ 選擇主題 THEME ]</div>
            <div class="segment-group" id="theme-group">
                <div class="segment-btn selected" data-val="school">SCHOOL</div>
                <div class="segment-btn" data-val="body">BODY</div>
                <div class="segment-btn" data-val="animals">ANIMALS</div>
                <div class="segment-btn" data-val="life">LIFE</div>
            </div>

            <div class="section-title">[ 卡牌數量 CARDS ]</div>
            <div class="segment-group" id="grid-group">
                <div class="segment-btn" data-val="12">12 張</div>
                <div class="segment-btn selected" data-val="16">16 張</div>
                <div class="segment-btn" data-val="20">20 張</div>
            </div>
            <div style="text-align: center; margin-top:10px; font-size: 1.1rem; color: #555; margin-bottom: 15px;">(匹配
                單字 與 圖案)</div>

            <div class="section-title">[ 最佳紀錄 BEST RECORDS ]</div>
            <div
                style="text-align: center; font-size: 1.4rem; background: #222; color: #FFF; padding: 10px; border: 4px solid var(--panel-inner-dark); margin-bottom: 10px;">
                12張: <span id="best-12" style="color: var(--text-gold);">--.--</span> s <br>
                16張: <span id="best-16" style="color: var(--text-gold);">--.--</span> s <br>
                20張: <span id="best-20" style="color: var(--text-gold);">--.--</span> s
            </div>
        </div>

        <div class="action-area">
            <button class="btn pixel-border btn-green" onclick="startGame()">▶ PLAY NOW</button>
            <button class="btn pixel-border" onclick="window.location.href='index.html'"
                style="margin-top: 20px; font-size: 1.2rem;">↲ BACK TO HOMEPAGE</button>
        </div>
        <!-- Hidden test button for video playback -->
        <button onclick="win()" style="opacity: 0.05; position: absolute; bottom: 10px; right: 10px; z-index: 100;">TEST
            WIN</button>
    </div>

    <!-- GAME UI -->
    <div id="game-ui" class="screen">
        <div id="game-bg"></div>

        <div id="hud-layer">
            <div class="hud-top-row">
                <div class="hud-left-panel">
                    <div id="hud-matches">MATCHES: 0 / 8</div>
                    <div id="hud-attempts">ATTEMPTS: 0</div>
                </div>

                <div class="hud-center-panel">
                    <div class="hud-title">MEMORY</div>
                    <div id="hud-timer"
                        style="font-size: 1.5rem; color: #FFF; background: #000; padding: 2px 10px; margin-top: 5px; border: 2px solid #555;">
                        00.00 s</div>
                </div>

                <div class="hud-right-group">
                    <button class="hud-btn hud-btn-exit" onclick="quitToMenu()">↲ EXIT</button>
                </div>
            </div>
        </div>

        <div id="game-board">
            <!-- Cards generated by JS -->
        </div>
    </div>

    <!-- VICTORY MENU -->
    <div id="victory-menu" class="screen dialog-overlay">
        <div class="dialog-box pixel-border" style="background: rgba(100, 255, 100, 0.9);">
            <div class="dialog-title">ALL MATCHED!</div>
            <div id="new-record-msg"
                style="display: none; color: #FF0000; font-size: 2rem; font-weight: bold; text-shadow: 2px 2px 0 #FFF; margin: -10px 0;">
                🎉 NEW RECORD! 🎉</div>
            <div style="font-size: 1.5rem; background:#000; color:#FFF; padding:10px;">
                Time: <span id="final-time" style="color:var(--text-gold);">00.00</span> s<br>
                Attempts: <span id="final-attempts" style="color:var(--text-gold);">0</span>
            </div>
            <button class="btn pixel-border btn-yellow" style="font-size: 2rem;"
                onclick="claimReward()">CONTINUE</button>
        </div>
    </div>

    <div id="video-container"
        style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 30; background: black;">
        <video id="victory-video" playsinline style="width: 100%; height: 100%; object-fit: contain;"></video>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        const $$ = selector => document.querySelectorAll(selector);

        // Dictionary
        const dictionary = {
            school: { "book": "📖", "pencil": "✏️", "desk": "🪑", "bag": "🎒", "clock": "⏰", "map": "🗺️" },
            body: { "eye": "👁️", "ear": "👂", "nose": "👃", "mouth": "👄", "hand": "✋", "head": "👱" },
            animals: { "dog": "🐶", "cat": "🐱", "bird": "🐦", "fish": "🐟", "pig": "🐷", "lion": "🦁" },
            life: { "apple": "🍎", "banana": "🍌", "sun": "☀️", "moon": "🌙", "car": "🚗", "house": "🏠" }
        };

        const praiseWords = ['Good!', 'Great!', 'Excellent!', 'Awesome!', 'Perfect!'];

        let currentTheme = 'school';
        let cardCount = 16;

        let attempts = 0;
        let matches = 0;
        let targetMatches = 8;
        let flippedCards = [];
        let lockBoard = false;

        let startTime = 0;
        let timerInterval = null;
        let finalTime = 0;

        // UI Setup
        $$('#theme-group .segment-btn').forEach(btn => {
            btn.onclick = () => {
                $$('#theme-group .segment-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                currentTheme = btn.dataset.val;
            }
        });

        $$('#grid-group .segment-btn').forEach(btn => {
            btn.onclick = () => {
                $$('#grid-group .segment-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                cardCount = parseInt(btn.dataset.val);
            }
        });

        // Audio System
        const synth = window.speechSynthesis;
        function speakWord(word) {
            if (synth.speaking) synth.cancel();
            const u = new SpeechSynthesisUtterance(word);
            u.lang = 'en-US'; u.rate = 0.9; synth.speak(u);
        }

        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSynth(type, freq, dropFreq, dur) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(dropFreq, audioCtx.currentTime + dur);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + dur);
        }

        function showScreen(id) {
            $$('.screen').forEach(el => el.classList.remove('active'));
            if (id) $(id).classList.add('active');
        }

        function quitToMenu() {
            showScreen('main-menu');
        }

        function startGame() {
            initAudio();
            generateBoard();

            attempts = 0;
            matches = 0;
            updateHUD();

            startTime = Date.now();
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 50);
            updateTimer();

            showScreen('game-ui');
        }

        function updateTimer() {
            let elapsed = (Date.now() - startTime) / 1000;
            $('hud-timer').innerText = elapsed.toFixed(2) + ' s';
        }

        function generateBoard() {
            const board = $('game-board');
            board.innerHTML = '';

            // Grid config based on card count
            let cols = cardCount === 12 ? 3 : cardCount === 16 ? 4 : 4;
            let rows = cardCount === 12 ? 4 : cardCount === 16 ? 4 : 5;
            board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            board.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

            targetMatches = cardCount / 2;
            flippedCards = [];
            lockBoard = false;

            // Prepare cards
            let deck = generateDeck();

            deck.forEach((card, index) => {
                const el = document.createElement('div');
                el.className = 'card pixel-border';
                el.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">❓</div>
                        <div class="card-back">
                            <div class="${card.type === 'emoji' ? 'card-emoji' : 'card-word'}">${card.content}</div>
                        </div>
                    </div>
                `;
                el.dataset.id = card.id;
                el.dataset.type = card.type;
                el.dataset.rawWord = card.rawWord;
                el.onclick = () => flipCard(el);
                board.appendChild(el);
            });
        }

        function generateDeck() {
            let words = Object.keys(dictionary[currentTheme]);
            let pairsNeeded = cardCount / 2;
            let selectedWords = [];

            // Select random words
            let mixedWords = [...words];
            while (selectedWords.length < pairsNeeded) {
                mixedWords.sort(() => 0.5 - Math.random());
                for (let w of mixedWords) {
                    if (selectedWords.length < pairsNeeded && !selectedWords.includes(w)) {
                        selectedWords.push(w);
                    } else if (selectedWords.length < pairsNeeded) {
                        // Allow duplicates if we need more pairs than available words
                        selectedWords.push(w);
                    }
                }
            }

            let deck = [];
            for (let w of selectedWords) {
                deck.push({ id: w, type: 'word', content: w.toUpperCase(), rawWord: w });
                deck.push({ id: w, type: 'emoji', content: dictionary[currentTheme][w], rawWord: w });
            }
            deck.sort(() => 0.5 - Math.random());
            return deck;
        }

        function flipCard(el) {
            if (lockBoard) return;
            if (el.classList.contains('flipped') || el.classList.contains('matched')) return;

            el.classList.add('flipped');
            playSynth('triangle', 600, 300, 0.1); // Flip sound

            // Announce any card flipped
            speakWord(el.dataset.rawWord);

            flippedCards.push(el);

            if (flippedCards.length === 2) {
                attempts++;
                checkForMatch();
            }
        }

        function checkForMatch() {
            let [card1, card2] = flippedCards;

            // To match, id must be the same, but types must be different (Word + Emoji)
            let isMatch = card1.dataset.id === card2.dataset.id && card1.dataset.type !== card2.dataset.type;

            if (isMatch) {
                disableCards();
            } else {
                unflipCards();
            }
            updateHUD();
        }

        function disableCards() {
            let [card1, card2] = flippedCards;
            lockBoard = true;

            setTimeout(() => {
                card1.classList.add('matched');
                card2.classList.add('matched');

                playSynth('square', 440, 880, 0.1); // Hit
                if (Math.random() < 0.5) {
                    speakWord(praiseWords[Math.floor(Math.random() * praiseWords.length)]);
                }

                flippedCards = [];
                matches++;
                updateHUD();
                lockBoard = false;

                if (matches === targetMatches) {
                    setTimeout(win, 500);
                }
            }, 600); // Small delay to let player see the match
        }

        function unflipCards() {
            lockBoard = true;
            setTimeout(() => {
                flippedCards[0].classList.remove('flipped');
                flippedCards[1].classList.remove('flipped');
                flippedCards = [];
                lockBoard = false;
                playSynth('sawtooth', 200, 100, 0.2); // Error sound
            }, 1200); // 1.2s to memorize
        }

        function updateHUD() {
            $('hud-matches').innerText = `MATCHES: ${matches} / ${targetMatches}`;
            $('hud-attempts').innerText = `ATTEMPTS: ${attempts}`;
        }

        function win() {
            clearInterval(timerInterval);
            finalTime = (Date.now() - startTime) / 1000;
            $('final-time').innerText = finalTime.toFixed(2);
            $('final-attempts').innerText = attempts;

            let bestTime = localStorage.getItem('memoryBest_' + cardCount);
            if (!bestTime || finalTime < parseFloat(bestTime)) {
                localStorage.setItem('memoryBest_' + cardCount, finalTime.toFixed(2));
                $('new-record-msg').style.display = 'block';
                updateBestRecordsUI();
            } else {
                $('new-record-msg').style.display = 'none';
            }

            showScreen('victory-menu');
            playSynth('square', 600, 1200, 0.2);
            setTimeout(() => playSynth('square', 800, 1600, 0.4), 250);
        }

        async function claimReward() {
            showScreen(null);

            if (window.AudioContext) {
                let t = 0;
                for (let i = 0; i < 5; i++) {
                    setTimeout(() => playSynth('sawtooth', 150 + Math.random() * 50, 100, 0.2), t);
                    t += 300 + Math.random() * 100;
                }
            }

            const container = $('video-container');
            const video = $('victory-video');

            function playVideo(url) {
                video.src = url;
                container.style.display = 'block';
                video.onended = () => { container.style.display = 'none'; quitToMenu(); };
                container.onclick = () => { video.pause(); container.style.display = 'none'; quitToMenu(); };
                video.play().catch(e => { console.error(e); setTimeout(() => { container.style.display = 'none'; quitToMenu(); }, 2000); });
            }

            function fallbackPlay() {
                let vidUrl = sessionStorage.getItem('victoryVideo');
                if (!vidUrl || vidUrl === 'undefined' || vidUrl.startsWith('blob:')) {
                    vidUrl = './grok-video-a512f103-c25e-4b51-8fed-d091b5190ead.mp4';
                }
                playVideo(vidUrl);
            }

            // Retrieve from IndexedDB first for cross-page blob support
            let request = indexedDB.open('MinecraftGameDB', 1);
            request.onsuccess = function (e) {
                let db = e.target.result;
                if (!db.objectStoreNames.contains('settings')) {
                    fallbackPlay();
                    return;
                }
                let getReq;
                try {
                    getReq = db.transaction('settings', 'readonly').objectStore('settings').get('victoryVideoFile');
                } catch (err) {
                    fallbackPlay();
                    return;
                }
                getReq.onsuccess = function () {
                    if (getReq.result) {
                        playVideo(URL.createObjectURL(getReq.result));
                    } else {
                        fallbackPlay();
                    }
                };
                getReq.onerror = fallbackPlay;
            };
            request.onerror = fallbackPlay;
        }

        function updateBestRecordsUI() {
            let b12 = localStorage.getItem('memoryBest_12');
            let b16 = localStorage.getItem('memoryBest_16');
            let b20 = localStorage.getItem('memoryBest_20');
            $('best-12').innerText = b12 ? b12 : '--.--';
            $('best-16').innerText = b16 ? b16 : '--.--';
            $('best-20').innerText = b20 ? b20 : '--.--';
        }

        updateBestRecordsUI();
    </script>
</body>

</html>
